services:
  app:
    build: .
    restart: always
    environment:
      # Checks pull requests on GitHub. Get one with: gh auth token
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_SYNC_INTERVAL: ${GITHUB_SYNC_INTERVAL:-60}
    volumes:
      # Database and attachments. See README for importing an existing board and for backups.
      - ultrakanban-data:/app/data
    expose:
      - '4317'

  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - '${ULTRAKANBAN_PORT:-4317}:80'
    volumes:
      # `z` relabels the file for containers; required where SELinux is enforcing (Fedora, RHEL).
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./deploy/40-resolver.sh:/docker-entrypoint.d/40-resolver.sh:ro,z
    depends_on:
      - app

  # The agents, in a container (Windows, macOS, or Linux without systemd); only with --profile agents. On Linux the
  # systemd user services (scripts/setup.sh --agents) run them on the machine itself instead. GPUs: deploy/compose.gpu.yml
  agents:
    profiles: [agents]
    build:
      context: .
      dockerfile: deploy/agents.Dockerfile
    restart: always
    environment:
      # gh and git push with it, so it needs write access to the boards' repositories. Or: gh auth login in the container
      GH_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: a token from `claude setup-token`, instead of logging in with claude in the container
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      # Home directory: claude's and gh's logins, and the clones the agents work in
      - ultrakanban-agent-home:/home/node
    depends_on:
      - app

volumes:
  ultrakanban-data:
  ultrakanban-agent-home:
