services:
  app:
    build:
      context: .
      args:
        # The commit it is built from, which the update button compares with the checkout's. The updater sets it; by
        # hand: ULTRAKANBAN_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
        ULTRAKANBAN_COMMIT: ${ULTRAKANBAN_COMMIT:-}
    restart: always
    environment:
      # Checks pull requests on GitHub. Optional: the Setup page (/setup) takes a token too. Get one with: gh auth token
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_SYNC_INTERVAL: ${GITHUB_SYNC_INTERVAL:-60}
      # Optional: TypeSafe AI, for routing tickets with Jev (docs/JEV.md). The Setup page takes a key too.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_API_BASE: ${TYPESAFE_API_BASE:-}
    volumes:
      # Database and attachments. See README for importing an existing board and for backups.
      - ultrakanban-data:/app/data
    expose:
      - '4317'

  nginx:
    # nginx with deploy/nginx.conf
    build:
      context: deploy
      dockerfile: nginx.Dockerfile
    restart: always
    ports:
      - '${ULTRAKANBAN_PORT:-4317}:80'
    depends_on:
      - app

  # The agents, in a container (Windows, macOS, or Linux without systemd); only with --profile agents. On Linux the
  # systemd user services (scripts/setup.sh --agents) run them on the machine itself instead. GPUs: deploy/compose.gpu.yml
  agents:
    profiles: [agents]
    build:
      context: .
      dockerfile: deploy/agents.Dockerfile
    restart: always
    environment:
      # gh and git push with it, so it needs write access to the boards' repositories. Or log the agents in to GitHub on
      # the Setup page (/setup)
      GH_TOKEN: ${GITHUB_TOKEN:-}
      # Optional: a token from `claude setup-token`, instead of logging the agents in to Claude on the Setup page
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional: a Claude Console API key runs go on once Claude usage runs out, if the overview allows it
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      # Optional: an endpoint that serves a local model or another provider's instead of Claude, and its token
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    volumes:
      # Home directory: claude's and gh's logins, and the clones the agents work in
      - ultrakanban-agent-home:/home/node
    depends_on:
      - app

  # Updates ultrakanban from the app's update button (deploy/updater.sh) where no agent supervisor on the machine does:
  # Windows, macOS, Linux without systemd. Only with --profile updater, which scripts/setup.sh adds there.
  updater:
    profiles: [updater]
    build:
      context: deploy
      dockerfile: updater.Dockerfile
    restart: always
    environment:
      KANBAN: http://app:4317
    volumes:
      # The checkout it pulls and rebuilds the board from
      - .:/repo
      # Docker, to rebuild and restart the board's containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app

volumes:
  ultrakanban-data:
  ultrakanban-agent-home:
