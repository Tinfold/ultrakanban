services:
  app:
    build: .
    restart: always
    environment:
      # Checks pull requests on GitHub. Get one with: gh auth token
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_SYNC_INTERVAL: ${GITHUB_SYNC_INTERVAL:-60}
    volumes:
      # Database and attachments. See README for importing an existing board and for backups.
      - ultrakanban-data:/app/data
    expose:
      - '4317'

  nginx:
    image: nginx:1.29-alpine
    restart: always
    ports:
      - '${ULTRAKANBAN_PORT:-8080}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  ultrakanban-data:
