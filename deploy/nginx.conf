server {
    listen 80;
    server_name _;

    # Attachments are capped at 25 MB by the API; leave room for multipart overhead.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css text/markdown application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-sent events: no buffering, no timeout.
    location /api/events {
        proxy_pass http://app:4317;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    location / {
        proxy_pass http://app:4317;
    }
}
