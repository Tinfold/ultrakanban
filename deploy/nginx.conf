server {
    listen 80;
    server_name _;

    # Request bodies are small JSON, except attachment uploads (below).
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css text/markdown application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `$app` is a variable so nginx re-resolves it per request (see deploy/40-resolver.sh).
    set $app app:4317;

    # Server-sent events: no buffering, no timeout.
    location /api/events {
        proxy_pass http://$app$request_uri;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    # Attachment uploads: the API allows people up to 1 GB (agents 25 MB) and enforces it itself, so leave room for
    # multipart overhead and stream the body to the app instead of buffering it to disk here first.
    location ~ ^/api/tickets/[^/]+/attachments$ {
        client_max_body_size 1025m;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
        proxy_pass http://$app$request_uri;
    }

    location / {
        proxy_pass http://$app$request_uri;
    }
}
